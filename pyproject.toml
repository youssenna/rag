[project]
name = "rag"
version = "0.1.0"
description = "Build a Retrieval-Augmented Generation system that answers questions about codebases by retrieving relevant information and generating evidence-based responses, implementing intelligent chunking, efficient retrieval (TF-IDF/BM25)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.16.0",
    "bm25s>=0.3.16",
    "fire>=0.7.1",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.86",
    "langchain-text-splitters>=0.3.11",
    "markdown>=3.11.3",
    "pdbpp",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "unstructured>=0.18.32",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
